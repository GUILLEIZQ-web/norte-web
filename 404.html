<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10151d">
  <title>Página no encontrada | Norte Web</title>
  <style>
    :root { color-scheme: light; --ink:#10151d; --lime:#b8ef4a; --paper:#f5f8ef; --muted:#4c5865; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); background:radial-gradient(circle at 80% 15%,#dff9aa 0,transparent 34%),var(--paper); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); padding:clamp(34px,7vw,72px); background:#fff; border:1px solid #dce4d4; border-radius:28px; box-shadow:0 28px 80px rgba(16,21,29,.12); }
    .mark { width:52px; height:52px; display:grid; place-items:center; border-radius:14px; color:var(--ink); background:var(--lime); font-size:24px; font-weight:900; }
    .eyebrow { margin:28px 0 10px; color:#315b18; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { max-width:560px; margin:0; font-size:clamp(38px,8vw,68px); line-height:.98; letter-spacing:-.055em; }
    p { max-width:520px; margin:20px 0 28px; color:var(--muted); font-size:17px; line-height:1.65; }
    a { min-height:48px; padding:0 20px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; color:var(--ink); background:var(--lime); font-weight:850; text-decoration:none; }
    a:hover { background:#cdfa73; }
    a:focus-visible { outline:3px solid #166534; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <p class="eyebrow">Error 404</p>
    <h1>Esta página no está disponible.</h1>
    <p>El enlace pudo cambiar o estar incompleto. Vuelve al portafolio para ver las páginas y demostraciones disponibles.</p>
    <a href="/norte-web/">Volver a Norte Web</a>
  </main>
</body>
</html>
